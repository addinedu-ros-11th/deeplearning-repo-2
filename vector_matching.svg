<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2.5; fill: none; }
      .thin { stroke: #333333; stroke-width: 2; fill: none; }
      .text { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 22px; }
      .small { fill: #333333; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 19px; }
      .label { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 24px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="520" />

  <!-- Title -->
  <text class="label" x="60" y="70">[ 벡터 매칭 시각화 ]</text>

  <!-- Origin -->
  <circle cx="220" cy="320" r="4" fill="#111111" />

  <!-- Vector A -->
  <line class="line" x1="220" y1="320" x2="380" y2="160" />
  <polygon points="380,160 370,165 378,175" fill="#111111" />
  <text class="text" x="120" y="150">Vector A (등록된 얼굴)</text>

  <!-- Vector B -->
  <line class="line" x1="220" y1="320" x2="520" y2="320" />
  <polygon points="520,320 508,314 508,326" fill="#111111" />
  <text class="text" x="545" y="330">Vector B (실시간 얼굴)</text>

  <!-- Angle arc -->
  <path class="thin" d="M270 320 A50 50 0 0 0 255 285" />
  <text class="text" x="270" y="275">θ (Angle)</text>

  <!-- Results -->
  <text class="text" x="60" y="430">▶ cos(θ) 값이 1.0에 가까움  →  Match</text>
  <text class="text" x="60" y="465">▶ cos(θ) 값이 0.0에 가까움  →  Mismatch</text>
</svg>
