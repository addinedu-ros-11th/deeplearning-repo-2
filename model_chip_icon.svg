<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .chip { fill: none; stroke: #1e40af; stroke-width: 6; stroke-linejoin: round; }
      .pin { stroke: #1e40af; stroke-width: 6; stroke-linecap: round; }
      .core { fill: #10b981; }
      .accent { stroke: #0ea5e9; stroke-width: 6; stroke-linecap: round; }
      .text { fill: #0f172a; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="320" height="320" />

  <!-- Chip body -->
  <rect class="chip" x="80" y="80" width="160" height="160" rx="16" />
  <rect class="core" x="125" y="125" width="70" height="70" rx="10" />

  <!-- Pins -->
  <line class="pin" x1="80" y1="110" x2="50" y2="110" />
  <line class="pin" x1="80" y1="160" x2="50" y2="160" />
  <line class="pin" x1="80" y1="210" x2="50" y2="210" />

  <line class="pin" x1="240" y1="110" x2="270" y2="110" />
  <line class="pin" x1="240" y1="160" x2="270" y2="160" />
  <line class="pin" x1="240" y1="210" x2="270" y2="210" />

  <line class="pin" x1="110" y1="80" x2="110" y2="50" />
  <line class="pin" x1="160" y1="80" x2="160" y2="50" />
  <line class="pin" x1="210" y1="80" x2="210" y2="50" />

  <line class="pin" x1="110" y1="240" x2="110" y2="270" />
  <line class="pin" x1="160" y1="240" x2="160" y2="270" />
  <line class="pin" x1="210" y1="240" x2="210" y2="270" />

  <!-- Speed badge -->
  <line class="accent" x1="185" y1="125" x2="205" y2="105" />
  <line class="accent" x1="205" y1="105" x2="225" y2="105" />
  <text class="text" x="120" y="290">60 FPS</text>
</svg>
