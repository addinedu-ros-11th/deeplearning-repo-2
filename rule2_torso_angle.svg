<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .thin { stroke: #333333; stroke-width: 1.5; fill: none; }
      .text { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 22px; }
      .small { fill: #333333; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 19px; }
      .label { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 24px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" />

  <!-- Titles -->
  <text class="label" x="140" y="60">[ 정상 : Standing ]</text>
  <text class="small" x="175" y="90">(Normal State)</text>

  <text class="label" x="730" y="60">[ 낙상 : Fall ]</text>
  <text class="small" x="770" y="90">(Emergency!)</text>

  <!-- Standing (vertical) -->
  <circle class="line" cx="240" cy="170" r="18" />
  <circle class="line" cx="240" cy="320" r="18" />
  <line class="line" x1="240" y1="190" x2="240" y2="300" />

  <text class="text" x="285" y="175">&lt;---- [어깨: Shoulder]</text>
  <text class="text" x="285" y="325">&lt;---- [골반: Hip]</text>

  <!-- Delta Y (standing) -->
  <line class="thin" x1="330" y1="190" x2="330" y2="300" />
  <polygon points="330,182 324,192 336,192" fill="#333333" />
  <polygon points="330,308 324,298 336,298" fill="#333333" />
  <text class="text" x="355" y="245">Delta Y (수직 거리)</text>
  <text class="small" x="385" y="270">(아주 김)</text>

  <!-- Standing result -->
  <text class="text" x="140" y="470">▶ 수직 거리(dy)가 큼</text>
  <text class="text" x="140" y="495">▶ 결과: OK</text>

  <!-- Fall (horizontal) -->
  <circle class="line" cx="780" cy="220" r="18" />
  <circle class="line" cx="950" cy="220" r="18" />
  <line class="line" x1="798" y1="220" x2="932" y2="220" />

  <text class="text" x="725" y="190">[어깨]</text>
  <text class="text" x="915" y="190">[골반]</text>

  <!-- Delta Y (fall) -->
  <line class="thin" x1="865" y1="255" x2="865" y2="300" />
  <polygon points="865,250 859,260 871,260" fill="#333333" />
  <polygon points="865,305 859,295 871,295" fill="#333333" />
  <text class="text" x="890" y="280">Delta Y ≈ 0</text>
  <text class="small" x="905" y="305">(거의 차이 없음)</text>

  <!-- Fall result -->
  <text class="text" x="720" y="470">▶ 수직 거리 거의 0</text>
  <text class="text" x="720" y="495">▶ 결과: FALL</text>
</svg>
