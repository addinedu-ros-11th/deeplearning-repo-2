<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .face { fill: #f8fafc; stroke: #0f172a; stroke-width: 4; }
      .feature { stroke: #0f172a; stroke-width: 4; stroke-linecap: round; fill: none; }
      .iris { fill: #2563eb; }
      .ring { stroke: #38bdf8; stroke-width: 6; fill: none; opacity: 0.9; }
      .scan { stroke: #22c55e; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="320" height="320" />

  <!-- Face outline -->
  <circle class="face" cx="160" cy="160" r="78" />

  <!-- Eyes -->
  <circle class="iris" cx="130" cy="150" r="6" />
  <circle class="iris" cx="190" cy="150" r="6" />
  <line class="feature" x1="118" y1="142" x2="142" y2="142" />
  <line class="feature" x1="178" y1="142" x2="202" y2="142" />

  <!-- Nose -->
  <line class="feature" x1="160" y1="160" x2="160" y2="185" />

  <!-- Mouth -->
  <path class="feature" d="M140 200 Q160 210 180 200" />

  <!-- Insight ring -->
  <circle class="ring" cx="160" cy="160" r="108" />

  <!-- Scan ticks -->
  <line class="scan" x1="45" y1="160" x2="70" y2="160" />
  <line class="scan" x1="250" y1="160" x2="275" y2="160" />
  <line class="scan" x1="160" y1="45" x2="160" y2="70" />
  <line class="scan" x1="160" y1="250" x2="160" y2="275" />
</svg>
