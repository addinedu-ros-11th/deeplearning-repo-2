<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140">
  <defs>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f97316" flood-opacity="0.25"/>
    </filter>
    <style>
      .curve { stroke: url(#arrowGrad); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #f97316; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 18px; font-weight: 700; }
      .chip { fill: #ffffff; stroke: #f97316; stroke-width: 2.5; filter: url(#softShadow); }
      .dot { fill: #f97316; }
    </style>
  </defs>

  <!-- Curved arrow -->
  <path class="curve" d="M 24 90 C 120 40, 210 40, 300 80" />
  <polyline class="curve" points="285,65 312,82 283,90" />

  <!-- Start dot -->
  <circle class="dot" cx="24" cy="90" r="4" />

  <!-- Label chip -->
  <rect class="chip" x="98" y="18" rx="14" ry="14" width="164" height="34" />
  <text class="label" x="116" y="41">클릭 → 저장 영상</text>
</svg>
