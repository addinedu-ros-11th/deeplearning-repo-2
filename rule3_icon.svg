<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 4; fill: none; }
      .accent { stroke: #f97316; stroke-width: 6; fill: none; }
      .dot { fill: #111111; }
      .label { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="320" height="240" />

  <!-- Inverted torso -->
  <circle class="dot" cx="160" cy="70" r="12" />
  <circle class="dot" cx="160" cy="150" r="12" />
  <line class="line" x1="160" y1="82" x2="160" y2="138" />

  <!-- Inversion arrow -->
  <line class="accent" x1="200" y1="70" x2="200" y2="150" />
  <polyline class="accent" points="190,140 200,150 210,140" />

  <text class="label" x="105" y="225">Rule 3</text>
</svg>
