<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .code { fill: #24292e; font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace; font-size: 20px; }
      .kw { fill: #d73a49; }
      .fn { fill: #6f42c1; }
      .num { fill: #005cc5; }
      .var { fill: #24292e; }
      .comment { fill: #6a737d; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="680" />

  <!-- Code -->
  <text class="code" x="50" y="80"><tspan class="kw">def</tspan> <tspan class="fn">check_fall_rule</tspan>(bbox, kpts):</text>
  <text class="code" x="90" y="120">x, y, w, h = bbox</text>

  <text class="code" x="90" y="180"><tspan class="comment"># Rule 1: 박스 비율</tspan></text>
  <text class="code" x="90" y="220"><tspan class="kw">if</tspan> w &gt; h * <tspan class="num">0.9</tspan>:</text>
  <text class="code" x="130" y="260"><tspan class="kw">return</tspan> True</text>

  <text class="code" x="90" y="325"><tspan class="comment"># Rule 2/3: 어깨-골반 관계</tspan></text>
  <text class="code" x="90" y="355"><tspan class="comment"># Y좌표는 아래로 갈수록 증가</tspan></text>
  <text class="code" x="90" y="405">shoulder_y = (kpts[5].y + kpts[6].y) / <tspan class="num">2</tspan></text>
  <text class="code" x="90" y="445">hip_y = (kpts[11].y + kpts[12].y) / <tspan class="num">2</tspan></text>
  <text class="code" x="90" y="485"><tspan class="kw">if</tspan> shoulder_y &gt; hip_y:</text>
  <text class="code" x="130" y="525"><tspan class="kw">return</tspan> True</text>

  <text class="code" x="90" y="565"><tspan class="kw">if</tspan> abs(shoulder_y - hip_y) &lt; h * <tspan class="num">0.2</tspan>:</text>
  <text class="code" x="130" y="605"><tspan class="kw">return</tspan> True</text>

  <text class="code" x="90" y="645"><tspan class="kw">return</tspan> False</text>
</svg>
