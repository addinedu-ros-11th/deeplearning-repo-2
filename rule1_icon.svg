<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 4; fill: none; }
      .accent { stroke: #1e40af; stroke-width: 6; fill: none; }
      .label { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="320" height="240" />

  <!-- Tall box (standing) -->
  <rect class="line" x="60" y="40" width="60" height="140" />
  <line class="accent" x1="60" y1="190" x2="120" y2="190" />

  <!-- Wide box (fall) -->
  <rect class="line" x="180" y="110" width="110" height="45" />
  <line class="accent" x1="180" y1="170" x2="290" y2="170" />

  <text class="label" x="105" y="225">Rule 1</text>
</svg>
