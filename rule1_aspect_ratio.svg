<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .thin { stroke: #333333; stroke-width: 1.5; fill: none; }
      .text { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 22px; }
      .small { fill: #333333; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 19px; }
      .label { fill: #111111; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 24px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" />

  <!-- Titles -->
  <text class="label" x="140" y="60">[ 정상 : Standing ]</text>
  <text class="small" x="175" y="90">(Normal State)</text>

  <text class="label" x="730" y="60">[ 낙상 : Fall ]</text>
  <text class="small" x="770" y="90">(Emergency!)</text>

  <!-- Standing box -->
  <rect class="line" x="210" y="140" width="90" height="210" />
  <line class="thin" x1="255" y1="170" x2="255" y2="320" />
  <text class="text" x="230" y="175">HEAD</text>
  <text class="text" x="230" y="240">BODY</text>
  <text class="text" x="230" y="310">LEGS</text>

  <!-- Height (H) label for standing -->
  <line class="thin" x1="330" y1="140" x2="330" y2="350" />
  <line class="thin" x1="324" y1="140" x2="336" y2="140" />
  <line class="thin" x1="324" y1="350" x2="336" y2="350" />
  <text class="text" x="350" y="240">Height (H)</text>
  <text class="small" x="365" y="265">(큼)</text>

  <!-- Width (w) label for standing -->
  <line class="thin" x1="210" y1="370" x2="300" y2="370" />
  <line class="thin" x1="210" y1="364" x2="210" y2="376" />
  <line class="thin" x1="300" y1="364" x2="300" y2="376" />
  <text class="text" x="210" y="410">Width (w)</text>
  <text class="small" x="228" y="435">(작음)</text>

  <!-- Standing result -->
  <text class="text" x="140" y="470">▶ 판정: w &lt; H</text>
  <text class="text" x="140" y="495">▶ 결과: OK</text>

  <!-- Fall box -->
  <rect class="line" x="690" y="170" width="350" height="60" />
  <text class="text" x="715" y="208">HEAD  ──  BODY  ──  LEGS</text>

  <!-- Height (h) label for fall -->
  <line class="thin" x1="1065" y1="170" x2="1065" y2="230" />
  <line class="thin" x1="1059" y1="170" x2="1071" y2="170" />
  <line class="thin" x1="1059" y1="230" x2="1071" y2="230" />
  <text class="text" x="1090" y="205">Height (h)</text>
  <text class="small" x="1110" y="228">(작음)</text>

  <!-- Width (W) label for fall -->
  <line class="thin" x1="690" y1="260" x2="1040" y2="260" />
  <line class="thin" x1="690" y1="254" x2="690" y2="266" />
  <line class="thin" x1="1040" y1="254" x2="1040" y2="266" />
  <text class="text" x="800" y="300">Width (W) (아주 큼)</text>

  <!-- Fall result -->
  <text class="text" x="740" y="360">▶ 판정: W &gt; h</text>
  <text class="text" x="740" y="385">▶ 결과: FALL</text>
</svg>
