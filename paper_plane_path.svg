<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140">
  <defs>
    <style>
      .trail { stroke: #f97316; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-dasharray: 2 9; }
      .plane { fill: none; stroke: #f97316; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Single cubic-style path with two inflection-like turns -->
  <path class="trail" d="M 20 110 C 100 20, 180 20, 220 80 S 300 150, 356 90" />

  <!-- Paper plane at the end -->
  <!-- Paper plane facing right -->
  <polygon class="plane" points="356,94 320,82 330,98" />
  <polyline class="plane" points="356,94 328,90" />
</svg>
